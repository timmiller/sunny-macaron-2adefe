<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Journey Checklist — Regenerative Revival</title>
<link rel="icon" type="image/png" href="gsc-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── RESET ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── TOKENS ── */
  :root {
    --ink:       #0f1923;
    --ink-2:     #3d4f5e;
    --ink-3:     #7a8f9e;
    --surface:   #ffffff;
    --surface-1: #f4f7fa;
    --surface-2: #eaf0f6;
    --border:    #dce5ed;
    --border-strong: #b8c9d8;

    --blue:      #1a5fa8;
    --blue-bg:   #e8f1fb;
    --blue-mid:  #3478c5;

    --green:     #1a7a4a;
    --green-bg:  #e6f6ee;
    --green-mid: #2a9e60;

    --gold:      #8a5a00;
    --gold-bg:   #fdf3dc;
    --gold-mid:  #c07f10;

    --red:       #a32020;
    --red-bg:    #fdeaea;

    --radius:    6px;
    --radius-lg: 10px;
    font-size: 15px;
  }

  /* ── ROLE COLORS ── */
  :root {
    --role-provider-bg:  #E6F1FB; --role-provider-border: #185FA5; --role-provider-text: #0C447C;
    --role-acct-bg:      #EAF3DE; --role-acct-border:     #3B6D11; --role-acct-text:     #27500A;
    --role-sales-bg:     #FAEEDA; --role-sales-border:    #854F0B; --role-sales-text:    #633806;
    --role-np-bg:        #E1F5EE; --role-np-border:       #0F6E56; --role-np-text:       #085041;
    --role-support-bg:   #F3F0FB; --role-support-border:  #534AB7; --role-support-text:  #3C3489;
    --role-rrops-bg:     #FBEAF0; --role-rrops-border:    #993556; --role-rrops-text:    #72243E;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    background: var(--surface-1);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--ink);
    padding: 0 32px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-logo {
    width: 28px; height: 28px;
    background: var(--blue-mid);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #fff; letter-spacing: 0.02em;
  }
  .topbar-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.02em; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-label { font-size: 11px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.1em; }

  /* ── PROVIDER BAR ── */
  .provider-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .pb-group { display: flex; align-items: center; gap: 8px; }
  .pb-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); white-space: nowrap; }
  select, input[type="text"] {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; color: var(--ink);
    background: var(--surface-1);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 6px 10px; outline: none; transition: border-color 0.15s;
  }
  select:focus, input[type="text"]:focus { border-color: var(--blue-mid); background: var(--surface); }
  select { min-width: 220px; cursor: pointer; }
  .initials-input { width: 72px; text-transform: uppercase; text-align: center; letter-spacing: 0.08em; }
  .initials-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--blue-bg); color: var(--blue);
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0.05em; border: 1px solid var(--border);
  }
  .pb-divider { width: 1px; height: 24px; background: var(--border); }
  .sync-status { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-mid); }
  .sync-dot.syncing { background: var(--gold-mid); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── OVERALL PROGRESS ── */
  .progress-strip {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 32px; display: flex; align-items: center; gap: 16px;
  }
  .ps-label { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .ps-bar-wrap { flex: 1; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; max-width: 400px; }
  .ps-bar-fill { height: 100%; background: var(--blue-mid); border-radius: 3px; transition: width 0.4s; }
  .ps-pct { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--blue); min-width: 38px; }
  .ps-counts { font-size: 12px; color: var(--ink-3); }

  /* ── LAYOUT ── */
  .main { max-width: 960px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ── PHASE HEADER ── */
  .phase-header {
    font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-3); padding: 28px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
  }
  .phase-header span { color: var(--ink-3); font-weight: 400; margin-left: 8px; text-transform: none; letter-spacing: 0; }

  /* ── STAGE BLOCK ── */
  .stage-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden; }
  .stage-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    cursor: pointer; user-select: none; transition: background 0.12s;
  }
  .stage-head:hover { background: var(--surface-1); }
  .stage-num {
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); transition: all 0.2s;
  }
  .stage-num.complete    { background: var(--green-bg);  color: var(--green); border-color: var(--green-mid); }
  .stage-num.blue-phase  { background: var(--blue-bg);   color: var(--blue);  border-color: var(--blue-mid); }
  .stage-num.green-phase { background: var(--green-bg);  color: var(--green); border-color: var(--green-mid); }
  .stage-num.gold-phase  { background: var(--gold-bg);   color: var(--gold);  border-color: var(--gold-mid); }

  .stage-info { flex: 1; min-width: 0; }
  .stage-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .stage-sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .stage-mini-bar-wrap { height: 3px; background: var(--surface-2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .stage-mini-bar { height: 3px; border-radius: 2px; transition: width 0.3s; }
  .stage-mini-bar.blue-phase  { background: var(--blue-mid); }
  .stage-mini-bar.green-phase { background: var(--green-mid); }
  .stage-mini-bar.gold-phase  { background: var(--gold-mid); }
  .stage-mini-bar.gray-phase  { background: var(--border-strong); }

  .stage-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-3); white-space: nowrap; flex-shrink: 0; }
  .stage-map-link { font-size: 11px; color: var(--blue); text-decoration: none; white-space: nowrap; flex-shrink: 0; opacity: 0.7; transition: opacity 0.15s; }
  .stage-map-link:hover { opacity: 1; text-decoration: underline; }
  .stage-chevron { color: var(--ink-3); font-size: 13px; transition: transform 0.2s; flex-shrink: 0; }
  .stage-chevron.open { transform: rotate(180deg); }

  /* ── STAGE BODY ── */
  .stage-body { display: none; border-top: 1px solid var(--border); }
  .stage-body.open { display: block; }

  /* ── COLUMN HEADERS ── */
  .col-headers {
    display: grid;
    grid-template-columns: 22px 1fr 28px 120px 28px 100px 32px;
    gap: 0 8px;
    padding: 5px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .col-headers span {
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  }
  .col-headers span:nth-child(3) { text-align: center; }
  .col-headers span:nth-child(4) { text-align: center; }

  /* ── ITEM ROW ── */
  .item-row {
    display: grid;
    grid-template-columns: 22px 1fr 28px 120px 28px 100px 32px;
    gap: 0 8px;
    align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    min-height: 40px;
  }
  .item-row:last-of-type { border-bottom: none; }
  .item-row:hover { background: var(--surface-1); }
  .item-row.checked { background: #f4fbf7; }
  .item-row.checked:hover { background: #ecf8f2; }

  .item-check {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border-strong); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; font-size: 11px; color: transparent;
    cursor: pointer;
  }
  .item-check.checked { background: var(--green-mid); border-color: var(--green-mid); color: white; }

  .item-text {
    font-size: 13px; color: var(--ink); line-height: 1.4; cursor: pointer;
  }
  .item-row.checked .item-text { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--border-strong); }

  /* ── ASSIGNED COLUMN ── */
  .item-assigned {
    display: flex; gap: 3px; flex-wrap: wrap; align-items: center; justify-content: center;
  }
  .assign-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    font-family: 'DM Mono', monospace;
    font-size: 9px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid transparent;
    cursor: default;
    flex-shrink: 0;
    title: "";
  }
  .assign-avatar.role-provider { background: var(--role-provider-bg); color: var(--role-provider-text); border-color: var(--role-provider-border); }
  .assign-avatar.role-acct     { background: var(--role-acct-bg);     color: var(--role-acct-text);     border-color: var(--role-acct-border); }
  .assign-avatar.role-sales    { background: var(--role-sales-bg);    color: var(--role-sales-text);    border-color: var(--role-sales-border); }
  .assign-avatar.role-np       { background: var(--role-np-bg);       color: var(--role-np-text);       border-color: var(--role-np-border); }
  .assign-avatar.role-support  { background: var(--role-support-bg);  color: var(--role-support-text);  border-color: var(--role-support-border); }
  .assign-avatar.role-rrops    { background: var(--role-rrops-bg);    color: var(--role-rrops-text);    border-color: var(--role-rrops-border); }

  /* ── COMPLETED COLUMN ── */
  .item-sigs { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .sig-pill {
    width: 26px; height: 26px; border-radius: 50%;
    font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    background: var(--green-bg); color: var(--green);
    border: 1.5px solid var(--green-mid);
    cursor: pointer; flex-shrink: 0;
  }

  /* ── ASSIGN BUTTON ── */
  .assign-btn {
    width: 24px; height: 24px; border-radius: 50%;
    background: transparent; border: 1.5px dashed var(--border-strong);
    color: var(--ink-3); font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  }
  .assign-btn:hover { background: var(--blue-bg); border-color: var(--blue-mid); color: var(--blue); }

  /* ── STAGE GATE ── */
  .stage-gate {
    padding: 9px 16px; background: var(--surface-1); border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--ink-2); font-style: italic;
  }
  .stage-gate strong { font-style: normal; font-weight: 600; color: var(--ink); }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .empty-state h3 { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--ink-2); }
  .empty-state p { font-size: 13px; }

  /* ── BUTTONS ── */
  .add-provider-btn {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--blue); background: transparent; border: 1px dashed var(--blue-mid);
    border-radius: var(--radius); padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: background 0.12s;
  }
  .add-provider-btn:hover { background: var(--blue-bg); }
  .edit-provider-btn {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--ink-3); background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 5px 10px; cursor: pointer; white-space: nowrap; transition: all 0.12s;
    display: none;
  }
  .edit-provider-btn:hover { background: var(--surface-2); color: var(--ink); }
  .edit-provider-btn.visible { display: inline-flex; align-items: center; gap: 4px; }

  /* ── PROVIDER FORM ── */
  .provider-form { display: flex; flex-direction: column; gap: 12px; }
  .provider-form-row { display: flex; flex-direction: column; gap: 4px; }
  .provider-form-row label { font-size: 11px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .provider-form-row input { width: 100%; }
  .provider-form-hint { font-size: 11px; color: var(--ink-3); margin-top: -4px; }

  /* ── ASSIGN MODAL SPECIFIC ── */
  .assign-form { display: flex; flex-direction: column; gap: 14px; }
  .assign-form-row { display: flex; flex-direction: column; gap: 5px; }
  .assign-form-row label { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .assign-form-row input, .assign-form-row select { width: 100%; }
  .assign-add-btn {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-mid);
    border-radius: var(--radius); padding: 6px 12px; cursor: pointer; transition: opacity 0.15s; align-self: flex-start;
  }
  .assign-add-btn:hover { opacity: 0.8; }
  .assignee-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .assignee-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface-1); font-size: 12px;
  }
  .assignee-chip-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid transparent; flex-shrink: 0;
  }
  .assignee-chip-avatar.role-provider { background: var(--role-provider-bg); color: var(--role-provider-text); border-color: var(--role-provider-border); }
  .assignee-chip-avatar.role-acct     { background: var(--role-acct-bg);     color: var(--role-acct-text);     border-color: var(--role-acct-border); }
  .assignee-chip-avatar.role-sales    { background: var(--role-sales-bg);    color: var(--role-sales-text);    border-color: var(--role-sales-border); }
  .assignee-chip-avatar.role-np       { background: var(--role-np-bg);       color: var(--role-np-text);       border-color: var(--role-np-border); }
  .assignee-chip-avatar.role-support  { background: var(--role-support-bg);  color: var(--role-support-text);  border-color: var(--role-support-border); }
  .assignee-chip-avatar.role-rrops    { background: var(--role-rrops-bg);    color: var(--role-rrops-text);    border-color: var(--role-rrops-border); }
  .assignee-chip-info { flex: 1; }
  .assignee-chip-name { font-weight: 500; color: var(--ink); }
  .assignee-chip-role { font-size: 10px; color: var(--ink-3); }
  .assignee-chip-remove {
    background: none; border: none; color: var(--ink-3); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1;
  }
  .assignee-chip-remove:hover { color: var(--red); }
  .assign-empty { font-size: 12px; color: var(--ink-3); font-style: italic; }

  /* ── DIRECTORY CHIPS ── */
  .dir-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .dir-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px 4px 4px; border-radius: 20px;
    border: 1.5px solid var(--border-strong); background: var(--surface-1);
    cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .dir-chip:hover { border-color: var(--blue-mid); background: var(--blue-bg); }
  .dir-chip.dir-chip-added { border-color: var(--green-mid); background: var(--green-bg); }
  .dir-chip-avatar {
    width: 20px; height: 20px; border-radius: 50%;
    font-family: 'DM Mono', monospace; font-size: 8px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid transparent; flex-shrink: 0;
  }
  .dir-chip-avatar.role-provider { background: var(--role-provider-bg); color: var(--role-provider-text); border-color: var(--role-provider-border); }
  .dir-chip-avatar.role-acct     { background: var(--role-acct-bg);     color: var(--role-acct-text);     border-color: var(--role-acct-border); }
  .dir-chip-avatar.role-sales    { background: var(--role-sales-bg);    color: var(--role-sales-text);    border-color: var(--role-sales-border); }
  .dir-chip-avatar.role-np       { background: var(--role-np-bg);       color: var(--role-np-text);       border-color: var(--role-np-border); }
  .dir-chip-avatar.role-support  { background: var(--role-support-bg);  color: var(--role-support-text);  border-color: var(--role-support-border); }
  .dir-chip-avatar.role-rrops    { background: var(--role-rrops-bg);    color: var(--role-rrops-text);    border-color: var(--role-rrops-border); }
  .dir-chip-avatar.role-gsc      { background: #345691; color: white; border-color: #1E3A6E; }
  .dir-chip-avatar.role-hub      { background: #854F0B; color: white; border-color: #5C3507; }
  .dir-chip-avatar.role-auto     { background: var(--role-support-bg);  color: var(--role-support-text);  border-color: var(--role-support-border); }
  .dir-chip-name { font-size: 11px; font-weight: 500; color: var(--ink-2); }
  .dir-chip.dir-chip-added .dir-chip-name { color: var(--green); }

  /* ── ROLE SELECT COLORS ── */
  .role-badge {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 4px; border: 1px solid transparent;
  }
  .role-badge.role-provider { background: var(--role-provider-bg); color: var(--role-provider-text); border-color: var(--role-provider-border); }
  .role-badge.role-acct     { background: var(--role-acct-bg);     color: var(--role-acct-text);     border-color: var(--role-acct-border); }
  .role-badge.role-sales    { background: var(--role-sales-bg);    color: var(--role-sales-text);    border-color: var(--role-sales-border); }
  .role-badge.role-np       { background: var(--role-np-bg);       color: var(--role-np-text);       border-color: var(--role-np-border); }
  .role-badge.role-support  { background: var(--role-support-bg);  color: var(--role-support-text);  border-color: var(--role-support-border); }
  .role-badge.role-rrops    { background: var(--role-rrops-bg);    color: var(--role-rrops-text);    border-color: var(--role-rrops-border); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,25,35,0.5);
    z-index: 200; display: none; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 24px; width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); max-height: 90vh; overflow-y: auto;
  }
  .modal:has(.whim-modal) { padding: 0; border: none; background: transparent; box-shadow: none; width: auto; max-height: none; overflow: visible; }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--ink-2); line-height: 1.5; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .btn {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    padding: 7px 16px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--ink-2); }
  .btn-green { background: var(--green-mid); color: white; }
  .btn-red   { background: var(--red); color: white; }

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentProvider = '';
let currentInitials  = '';
let PROVIDERS        = [];

// checkData shape:
// {
//   "s1_i0": { sigs: { "TM": "Jul 6, 2026", ... }, assigned: [ { name, role, initials }, ... ] },
//   ...
// }
let checkData    = {};
let pendingAction = null;
let saveTimer     = null;

// Temporary assignee list being edited in the assign modal
let pendingAssignees = [];

// ── PEOPLE DIRECTORY (per provider, stored in KV under __dir__ key) ──
let peopleDirectory = []; // [{name, role, initials}, ...]

function dirKey() { return '__dir__'; }

function loadDirectory() {
  const raw = checkData[dirKey()];
  peopleDirectory = raw?.people || [];
}

function saveDirectory() {
  checkData[dirKey()] = { people: peopleDirectory };
}

function addToDirectory(person) {
  // Add if not already present (match by name)
  if (!peopleDirectory.find(p => p.name.toLowerCase() === person.name.toLowerCase())) {
    peopleDirectory.push({ name: person.name, role: person.role, initials: person.initials });
    saveDirectory();
  }
}

function getAllDirectoryPeople() {
  return [...peopleDirectory].sort((a,b) => a.name.localeCompare(b.name));
}

function itemKey(sId, idx) { return `s${sId}_i${idx}`; }
function getItemData(sId, idx) { return checkData[itemKey(sId, idx)] || null; }
function getSigs(sId, idx)  { return getItemData(sId, idx)?.sigs || null; }
function getAssigned(sId, idx) { return getItemData(sId, idx)?.assigned || []; }
function isChecked(sId, idx) { const s = getSigs(sId, idx); return s && Object.keys(s).length > 0; }

// ─────────────────────────────────────────────
// API
// ─────────────────────────────────────────────
const USE_API = API_URL && !API_URL.includes('YOUR-WORKER');

async function loadFromAPI(providerId) {
  if (!USE_API) return loadFromLocal(providerId);
  setSyncStatus('syncing', 'Loading…');
  try {
    const r = await fetch(`${API_URL}?provider=${encodeURIComponent(providerId)}`);
    if (!r.ok) throw new Error(r.status);
    const json = await r.json();
    checkData = migrateLegacyData(json.data || {});
    loadDirectory();
    setSyncStatus('ok', 'Synced');
  } catch(e) {
    setSyncStatus('error', 'Offline — using local');
    loadFromLocal(providerId);
  }
}

// Migrate old flat sig format → new {sigs, assigned} format
function migrateLegacyData(raw) {
  const out = {};
  for (const [k, v] of Object.entries(raw)) {
    if (v && typeof v === 'object' && !v.sigs && !v.assigned) {
      // old format: { "TM": "date", ... }
      out[k] = { sigs: v, assigned: [], notes: [], questions: [] };
    } else {
      if (v && !v.notes)     v.notes = [];
      if (v && !v.questions) v.questions = [];
      out[k] = v;
    }
  }
  return out;
}

async function saveToAPI() {
  if (!USE_API) { saveToLocal(); return; }
  setSyncStatus('syncing', 'Saving…');
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: currentProvider, data: checkData }),
    });
    setSyncStatus('ok', 'Saved');
  } catch(e) {
    setSyncStatus('error', 'Save failed');
    saveToLocal();
  }
}

function loadFromLocal(providerId) {
  try {
    const raw = localStorage.getItem(`rr_checklist_${providerId}`);
    checkData = migrateLegacyData(raw ? JSON.parse(raw) : {});
    loadDirectory();
  } catch(e) { checkData = {}; }
}

function saveToLocal() {
  if (!currentProvider) return;
  try { localStorage.setItem(`rr_checklist_${currentProvider}`, JSON.stringify(checkData)); } catch(e) {}
}

function debouncedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToAPI, 600);
}

function setSyncStatus(state, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
  lbl.textContent = label;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function buildChecklist() {
  const container = document.getElementById('main-content');
  if (!currentProvider) {
    container.innerHTML = '<div class="empty-state"><h3>Select a provider to begin</h3><p>Choose a provider from the dropdown above, then enter your initials to start checking off items.</p></div>';
    document.getElementById('progress-strip').style.display = 'none';
    return;
  }
  document.getElementById('progress-strip').style.display = 'flex';
  let html = '';
  STAGES.forEach(stage => {
    if (stage.phaseStart) html += `<div class="phase-header">${stage.phase}</div>`;
    html += buildStageHTML(stage);
  });
  container.innerHTML = html;
  updateOverall();
  buildFilterDropdown();
  applyFilter();
  const firstOpen = STAGES.find(s => s.items.some((_, i) => !isChecked(s.id, i)));
  if (firstOpen) {
    document.getElementById(`body-${firstOpen.id}`)?.classList.add('open');
    document.getElementById(`chev-${firstOpen.id}`)?.classList.add('open');
  }
}

function buildStageHTML(stage) {
  const total = stage.items.length;
  const done  = stage.items.filter((_, i) => isChecked(stage.id, i)).length;
  const pct   = total > 0 ? Math.round(done / total * 100) : 0;
  const complete = done === total;
  const numClass = complete ? 'complete' : stage.color;

  const itemsHTML = stage.items.map((item, i) => buildItemHTML(stage.id, i, item)).join('');

  return `
<div class="stage-block" id="stage-${stage.id}">
  <div class="stage-head" onclick="toggleStage(${stage.id})">
    <div class="stage-num ${numClass}">${stage.id}</div>
    <div class="stage-info">
      <div class="stage-title">${stage.title}</div>
      <div class="stage-sub">${stage.sub}</div>
      <div class="stage-mini-bar-wrap">
        <div class="stage-mini-bar ${stage.color}" style="width:${pct}%"></div>
      </div>
    </div>
    <div class="stage-count">${done}/${total}</div>
    <a class="stage-map-link" href="${JOURNEY_MAP_URL}#stage-${stage.id}" target="_blank" onclick="event.stopPropagation()">map ↗</a>
    <div class="stage-chevron" id="chev-${stage.id}">▾</div>
  </div>
  <div class="stage-body" id="body-${stage.id}">
    <div class="col-headers">
      <span></span>
      <span>Task</span>
      <span></span>
      <span>Assigned</span>
      <span></span>
      <span>Completed</span>
      <span></span>
    </div>
    ${itemsHTML}
    <div class="stage-gate"><strong>Stage gate:</strong> ${stage.gate}</div>
  </div>
</div>`;
}

function buildItemHTML(stageId, idx, text) {
  const sigs     = getSigs(stageId, idx);
  const checked  = sigs && Object.keys(sigs).length > 0;
  const assigned = getAssigned(stageId, idx);

  // Assigned avatars
  const avatarsHTML = assigned.length
    ? assigned.map(a => {
        const role = roleById(a.role);
        return `<div class="assign-avatar ${role.cls}" title="${a.name} · ${role.label}">${a.initials}</div>`;
      }).join('')
    : '';

  // Completed pills
  const sigsHTML = sigs
    ? Object.entries(sigs).map(([u, ts]) =>
        `<span class="sig-pill ${u === currentInitials ? 'me' : ''}" title="${ts} — click to remove" onclick="removeSig(event,${stageId},${idx},'${u}')">${u}</span>`
      ).join('')
    : '';

  // Notes icon
  const notes = getItemNotes(stageId, idx);
  const noteCount = notes.length;
  const noteTooltip = noteCount
    ? notes.slice(-3).reverse().map(n => `<div class="tooltip-entry"><div class="tooltip-meta">${n.initials} · ${n.ts}</div><div class="tooltip-text">${n.text.substring(0,80)}${n.text.length>80?'…':''}</div></div>`).join('')
    : '<div class="tooltip-empty">No notes yet</div>';
  const notesIconHTML = `<div class="icon-tooltip-wrap">
    <button class="icon-btn ${noteCount ? 'has-content' : ''}" onclick="showNotesModal(event,${stageId},${idx})" title="Notes">
      📋${noteCount ? `<span class="icon-badge">${noteCount}</span>` : ''}
    </button>
    ${noteCount ? `<div class="icon-tooltip">${noteTooltip}</div>` : ''}
  </div>`;

  // Questions icon — 3 states: empty, open, all-answered
  const questions = getItemQuestions(stageId, idx);
  const qTotal    = questions.length;
  const qOpen     = questions.filter(q => !q.answered).length;
  const allAnswered = qTotal > 0 && qOpen === 0;
  const qClass    = qTotal === 0 ? 'q-empty' : (allAnswered ? 'q-done' : 'q-open');
  const qEmoji    = allAnswered ? '✓' : '?';
  const qTooltip  = qTotal
    ? questions.slice(0, 4).map(q =>
        `<div class="tooltip-entry"><div class="${q.answered ? 'tooltip-q-answered' : 'tooltip-q-open'}">${q.answered ? '✓ ' : ''}${q.text.substring(0,70)}${q.text.length > 70 ? '…' : ''}</div></div>`
      ).join('')
    : '';
  const questionsIconHTML = `<div class="icon-tooltip-wrap">
    <button class="icon-btn ${qClass}" onclick="showQuestionsModal(event,${stageId},${idx})" style="font-size:11px;font-weight:700;font-family:'DM Mono',monospace;">
      ${qEmoji}${qTotal ? `<span class="icon-badge">${qTotal}</span>` : ''}
    </button>
    ${qTooltip ? `<div class="icon-tooltip">${qTooltip}</div>` : ''}
  </div>`;

  return `
<div class="item-row ${checked ? 'checked' : ''}" id="item-${stageId}-${idx}">
  <div class="item-check ${checked ? 'checked' : ''}" onclick="itemClick(${stageId},${idx})">${checked ? '✓' : ''}</div>
  <div class="item-text" onclick="itemClick(${stageId},${idx})">${text}</div>
  ${notesIconHTML}
  <div class="item-assigned">${avatarsHTML}</div>
  ${questionsIconHTML}
  <div class="item-sigs">${sigsHTML}</div>
  <button class="assign-btn" onclick="showAssignModal(event,${stageId},${idx})" title="Assign / edit people">＋</button>
</div>`;
}

function refreshStage(stageId) {
  const stage = STAGES.find(s => s.id === stageId);
  const old = document.getElementById(`stage-${stageId}`);
  if (!old) return;
  const wasOpen = document.getElementById(`body-${stageId}`)?.classList.contains('open');
  old.outerHTML = buildStageHTML(stage);
  if (wasOpen) {
    document.getElementById(`body-${stageId}`)?.classList.add('open');
    document.getElementById(`chev-${stageId}`)?.classList.add('open');
  }
  updateOverall();
}

function updateOverall() {
  let total = 0, done = 0;
  STAGES.forEach(s => {
    total += s.items.length;
    done  += s.items.filter((_, i) => isChecked(s.id, i)).length;
  });
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('overall-bar').style.width = pct + '%';
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('overall-counts').textContent = `${done} of ${total} items complete`;
}

// ─────────────────────────────────────────────
// COMPLETE / SIGN-OFF INTERACTIONS
// ─────────────────────────────────────────────
function toggleStage(id) {
  document.getElementById(`body-${id}`)?.classList.toggle('open');
  document.getElementById(`chev-${id}`)?.classList.toggle('open');
}

function itemClick(stageId, idx) {
  if (!currentProvider) { showToast('Select a provider first'); return; }
  if (!currentInitials)  { showToast('Enter your initials first'); return; }
  const sigs = getSigs(stageId, idx);
  const text = STAGES.find(s => s.id === stageId).items[idx];
  const alreadySigned = sigs && sigs[currentInitials];
  pendingAction = { type: 'complete', stageId, idx, alreadySigned };

  if (alreadySigned) {
    showSimpleModal(
      'Remove your sign-off?',
      `Remove ${currentInitials} from "${text}"?`,
      [
        { label: 'Cancel', cls: 'btn-ghost', action: closeModal },
        { label: 'Remove', cls: 'btn-red',   action: confirmComplete },
      ]
    );
  } else {
    showSimpleModal(
      'Sign off this item?',
      sigs
        ? `Add ${currentInitials} to existing sign-offs on "${text}".`
        : `Record ${currentInitials} · ${new Date().toLocaleDateString()} on "${text}".`,
      [
        { label: 'Cancel',   cls: 'btn-ghost', action: closeModal },
        { label: 'Sign off', cls: 'btn-green', action: confirmComplete },
      ]
    );
  }
}

function removeSig(e, stageId, idx, user) {
  e.stopPropagation();
  if (user !== currentInitials) { showToast('You can only remove your own sign-off'); return; }
  pendingAction = { type: 'complete', stageId, idx, alreadySigned: true };
  const text = STAGES.find(s => s.id === stageId).items[idx];
  showSimpleModal(
    'Remove your sign-off?',
    `Remove ${currentInitials} from "${text}"?`,
    [
      { label: 'Cancel', cls: 'btn-ghost', action: closeModal },
      { label: 'Remove', cls: 'btn-red',   action: confirmComplete },
    ]
  );
}

function confirmComplete() {
  if (!pendingAction || pendingAction.type !== 'complete') return;
  const { stageId, idx, alreadySigned } = pendingAction;
  const key = itemKey(stageId, idx);
  const existing = checkData[key] || { sigs: {}, assigned: [] };

  if (alreadySigned) {
    delete existing.sigs[currentInitials];
    if (Object.keys(existing.sigs).length === 0 && existing.assigned.length === 0) {
      delete checkData[key];
    } else {
      checkData[key] = existing;
    }
    showToast(`${currentInitials} removed`);
  } else {
    const ts = new Date().toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
    existing.sigs[currentInitials] = ts;
    checkData[key] = existing;
    showToast(`Signed off — ${currentInitials}`);
  }
  closeModal();
  refreshStage(stageId);
  debouncedSave();
}

// ─────────────────────────────────────────────
// ASSIGN MODAL
// ─────────────────────────────────────────────
function showAssignModal(e, stageId, idx) {
  e.stopPropagation();
  if (!currentProvider) { showToast('Select a provider first'); return; }
  const text = STAGES.find(s => s.id === stageId).items[idx];
  pendingAssignees = JSON.parse(JSON.stringify(getAssigned(stageId, idx)));
  pendingAction = { type: 'assign', stageId, idx };

  const overlay = document.getElementById('modal-overlay');
  const titleEl = document.getElementById('modal-title');
  const bodyEl  = document.getElementById('modal-body');
  const actsEl  = document.getElementById('modal-actions');

  titleEl.textContent = 'Assign people';

  const dirPeople = getAllDirectoryPeople();
  const dirChipsHTML = dirPeople.length
    ? `<div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;">From directory</div>
       <div class="dir-chips" id="dir-chips">
         ${dirPeople.map(p => {
           const role = roleById(p.role);
           const alreadyAdded = pendingAssignees.some(a => a.name.toLowerCase() === p.name.toLowerCase());
           return `<button class="dir-chip ${alreadyAdded?'dir-chip-added':''}" onclick="addFromDirectory('${p.name.replace(/'/g,"\'")}','${p.role}','${p.initials}')" title="${role.label}">
             <span class="dir-chip-avatar ${role.cls}">${p.initials}</span>
             <span class="dir-chip-name">${p.name.split(' ')[0]}</span>
           </button>`;
         }).join('')}
       </div>`
    : '';

  bodyEl.innerHTML = `
<p style="font-size:12px;color:var(--ink-3);margin-bottom:12px;">${text}</p>
<div class="assign-form">
  ${dirChipsHTML ? `<div style="margin-bottom:12px;">${dirChipsHTML}</div>` : ''}
  <div id="assignee-list-wrap"></div>
  <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
    <div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;">Add new person</div>
    <div class="assign-form-row">
      <label>Role</label>
      <select id="assign-role">
        ${ROLES.map(r => `<option value="${r.id}">${r.label}</option>`).join('')}
      </select>
    </div>
    <div class="assign-form-row" style="margin-top:8px;">
      <label>Full name</label>
      <input type="text" id="assign-name" placeholder="e.g. Dana Cook" autocomplete="off" />
    </div>
    <button class="assign-add-btn" style="margin-top:10px;" onclick="addAssignee()">+ Add to list</button>
  </div>
</div>`;

  actsEl.innerHTML = '';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = closeModal;
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-green';
  saveBtn.textContent = 'Save';
  saveBtn.onclick = confirmAssign;
  actsEl.appendChild(cancelBtn);
  actsEl.appendChild(saveBtn);

  overlay.classList.add('open');
  renderAssigneeList();

  // Allow Enter key to add
  setTimeout(() => {
    document.getElementById('assign-name')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addAssignee(); }
    });
  }, 50);
}

function renderAssigneeList() {
  const wrap = document.getElementById('assignee-list-wrap');
  if (!wrap) return;
  if (pendingAssignees.length === 0) {
    wrap.innerHTML = '<div class="assign-empty">No one assigned yet.</div>';
    return;
  }
  wrap.innerHTML = `<div class="assignee-list">${
    pendingAssignees.map((a, i) => {
      const role = roleById(a.role);
      return `
<div class="assignee-chip">
  <div class="assignee-chip-avatar ${role.cls}">${a.initials}</div>
  <div class="assignee-chip-info">
    <div class="assignee-chip-name">${a.name}</div>
    <div class="assignee-chip-role">${role.label}</div>
  </div>
  <button class="assignee-chip-remove" onclick="removeAssignee(${i})" title="Remove">×</button>
</div>`;
    }).join('')
  }</div>`;
}

function addAssignee() {
  const roleId = document.getElementById('assign-role')?.value;
  const name   = document.getElementById('assign-name')?.value.trim();
  if (!name) { showToast('Enter a name'); return; }
  const initials = initialsFrom(name);
  // Prevent exact duplicate name+role
  if (pendingAssignees.find(a => a.name.toLowerCase() === name.toLowerCase() && a.role === roleId)) {
    showToast('Already in list'); return;
  }
  pendingAssignees.push({ name, role: roleId, initials });
  document.getElementById('assign-name').value = '';
  document.getElementById('assign-name').focus();
  renderAssigneeList();
}

function removeAssignee(idx) {
  pendingAssignees.splice(idx, 1);
  renderAssigneeList();
  refreshDirChips();
}

function addFromDirectory(name, roleId, initials) {
  if (pendingAssignees.find(a => a.name.toLowerCase() === name.toLowerCase())) {
    // already added — remove instead (toggle)
    const i = pendingAssignees.findIndex(a => a.name.toLowerCase() === name.toLowerCase());
    pendingAssignees.splice(i, 1);
  } else {
    if (pendingAssignees.length >= 3) { showToast('Max 3 people per task'); return; }
    pendingAssignees.push({ name, role: roleId, initials });
  }
  renderAssigneeList();
  refreshDirChips();
}

function refreshDirChips() {
  const wrap = document.getElementById('dir-chips');
  if (!wrap) return;
  const dirPeople = getAllDirectoryPeople();
  wrap.innerHTML = dirPeople.map(p => {
    const role = roleById(p.role);
    const alreadyAdded = pendingAssignees.some(a => a.name.toLowerCase() === p.name.toLowerCase());
    return `<button class="dir-chip ${alreadyAdded?'dir-chip-added':''}" onclick="addFromDirectory('${p.name.replace(/'/g,"\'")}','${p.role}','${p.initials}')" title="${role.label}">
      <span class="dir-chip-avatar ${role.cls}">${p.initials}</span>
      <span class="dir-chip-name">${p.name.split(' ')[0]}</span>
    </button>`;
  }).join('');
}

function confirmAssign() {
  if (!pendingAction || pendingAction.type !== 'assign') return;
  const { stageId, idx } = pendingAction;
  const key = itemKey(stageId, idx);
  const existing = checkData[key] || { sigs: {}, assigned: [] };
  existing.assigned = pendingAssignees;
  // Auto-add any new people to the directory
  pendingAssignees.forEach(p => addToDirectory(p));
  if (Object.keys(existing.sigs).length === 0 && existing.assigned.length === 0) {
    delete checkData[key];
  } else {
    checkData[key] = existing;
  }
  closeModal();
  refreshStage(stageId);
  buildFilterDropdown();
  applyFilter();
  debouncedSave();
  showToast(pendingAssignees.length ? `${pendingAssignees.length} person${pendingAssignees.length > 1 ? 's' : ''} assigned` : 'Assignments cleared');
}

function showSimpleModal(title, bodyText, buttons) {
  document.getElementById('modal-title').textContent = title;
  const bodyEl = document.getElementById('modal-body');
  bodyEl.innerHTML = `<p>${bodyText}</p>`;
  const actsEl = document.getElementById('modal-actions');
  actsEl.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = `btn ${b.cls}`;
    btn.textContent = b.label;
    btn.onclick = b.action;
    actsEl.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

// Legacy showModal kept for provider forms
function showModal(title, body, buttons, formHTML) {
  document.getElementById('modal-title').textContent = title;
  const bodyEl = document.getElementById('modal-body');
  bodyEl.innerHTML = formHTML || `<p>${body}</p>`;
  const actsEl = document.getElementById('modal-actions');
  actsEl.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = `btn ${b.cls}`;
    btn.textContent = b.label;
    btn.onclick = b.action;
    actsEl.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  pendingAction = null;
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ─────────────────────────────────────────────
// PROVIDER SELECT + INITIALS
// ─────────────────────────────────────────────
async function loadProviders() {
  try {
    const r = await fetch(PROVIDERS_URL);
    if (r.ok) {
      const json = await r.json();
      PROVIDERS = json.providers || [];
    }
  } catch(e) {
    try {
      const raw = localStorage.getItem('rr_providers');
      if (raw) PROVIDERS = JSON.parse(raw);
    } catch(e2) {}
  }
  if (PROVIDERS.length === 0) {
    PROVIDERS = [{ id: 'rr-001-dubov-cali-ny-nj', label: 'RR-001 · Dubov/Cali — NY/NJ' }];
    await saveProviders();
  }
}

async function saveProviders() {
  try {
    await fetch(PROVIDERS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ providers: PROVIDERS }),
    });
    localStorage.setItem('rr_providers', JSON.stringify(PROVIDERS));
  } catch(e) {
    localStorage.setItem('rr_providers', JSON.stringify(PROVIDERS));
  }
}

function populateProviderSelect() {
  const sel = document.getElementById('provider-select');
  while (sel.options.length > 1) sel.remove(1);
  PROVIDERS.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.label;
    sel.appendChild(opt);
  });
  const saved = localStorage.getItem('rr_last_provider');
  if (saved && PROVIDERS.find(p => p.id === saved)) {
    sel.value = saved;
    handleProviderChange(saved);
  }
}

document.getElementById('provider-select').addEventListener('change', function() {
  handleProviderChange(this.value);
});

async function handleProviderChange(id) {
  currentProvider = id;
  checkData = {};
  peopleDirectory = [];
  document.getElementById('edit-provider-btn')?.classList.toggle('visible', !!id);
  if (id) {
    localStorage.setItem('rr_last_provider', id);
    await loadFromAPI(id);
  }
  buildChecklist();
}

document.getElementById('initials-input').addEventListener('input', function() {
  currentInitials = this.value.toUpperCase().trim();
  this.value = currentInitials;
  document.getElementById('initials-avatar').textContent = currentInitials || '—';
  localStorage.setItem('rr_initials', currentInitials);
  buildChecklist();
});

// ─────────────────────────────────────────────
// ADD / EDIT PROVIDER
// ─────────────────────────────────────────────
function showAddProvider() {
  showModal('Add new provider', '',
    [
      { label: 'Cancel',       cls: 'btn-ghost', action: closeModal },
      { label: 'Add provider', cls: 'btn-green', action: submitNewProvider },
    ],
    `<div class="provider-form">
      <div class="provider-form-row">
        <label>RR Number</label>
        <input type="text" id="new-rr-num" placeholder="e.g. 002" maxlength="6" />
        <span class="provider-form-hint">Next available number</span>
      </div>
      <div class="provider-form-row">
        <label>Last name</label>
        <input type="text" id="new-last-name" placeholder="e.g. Smith" />
      </div>
      <div class="provider-form-row">
        <label>City</label>
        <input type="text" id="new-city" placeholder="e.g. Houston" />
      </div>
    </div>`
  );
  const nums = PROVIDERS.map(p => parseInt(p.id.replace('rr-','').split('-')[0]) || 0);
  const next = (Math.max(0, ...nums) + 1).toString().padStart(3,'0');
  setTimeout(() => { const el = document.getElementById('new-rr-num'); if (el) el.value = next; }, 50);
}

function showEditProvider() {
  const provider = PROVIDERS.find(p => p.id === currentProvider);
  if (!provider) return;
  const numMatch = provider.label.match(/RR-(\d+)/);
  const midMatch = provider.label.match(/· (.+) — (.+)$/);
  showModal('Edit provider', '',
    [
      { label: 'Cancel', cls: 'btn-ghost', action: closeModal },
      { label: 'Delete', cls: 'btn-red',   action: deleteProvider },
      { label: 'Save',   cls: 'btn-green', action: saveEditProvider },
    ],
    `<div class="provider-form">
      <div class="provider-form-row">
        <label>RR Number</label>
        <input type="text" id="edit-rr-num" value="${numMatch?.[1]||''}" maxlength="6" />
      </div>
      <div class="provider-form-row">
        <label>Last name / names</label>
        <input type="text" id="edit-last-name" value="${midMatch?.[1]||''}" />
      </div>
      <div class="provider-form-row">
        <label>City / region</label>
        <input type="text" id="edit-city" value="${midMatch?.[2]||''}" />
        <span class="provider-form-hint">Slashes OK — e.g. NY/NJ or Dallas/Fort Worth</span>
      </div>
    </div>`
  );
}

async function saveEditProvider() {
  const num  = document.getElementById('edit-rr-num')?.value.trim().padStart(3,'0');
  const last = document.getElementById('edit-last-name')?.value.trim();
  const city = document.getElementById('edit-city')?.value.trim();
  if (!num || !last || !city) { showToast('Fill in all three fields'); return; }
  const newLabel = `RR-${num} · ${last} — ${city}`;
  const idx = PROVIDERS.findIndex(p => p.id === currentProvider);
  if (idx === -1) return;
  PROVIDERS[idx] = { id: currentProvider, label: newLabel };
  await saveProviders();
  populateProviderSelect();
  document.getElementById('provider-select').value = currentProvider;
  closeModal();
  showToast(`Renamed to ${newLabel}`);
}

async function deleteProvider() {
  const provider = PROVIDERS.find(p => p.id === currentProvider);
  if (!confirm(`Delete "${provider?.label}"? This cannot be undone.`)) return;
  PROVIDERS = PROVIDERS.filter(p => p.id !== currentProvider);
  await saveProviders();
  try {
    await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: currentProvider, data: {} }),
    });
  } catch(e) {}
  currentProvider = ''; checkData = {};
  closeModal();
  populateProviderSelect();
  document.getElementById('provider-select').value = '';
  document.getElementById('edit-provider-btn')?.classList.remove('visible');
  buildChecklist();
  showToast('Provider deleted');
}

async function submitNewProvider() {
  const num  = document.getElementById('new-rr-num')?.value.trim().padStart(3,'0');
  const last = document.getElementById('new-last-name')?.value.trim();
  const city = document.getElementById('new-city')?.value.trim();
  if (!num || !last || !city) { showToast('Fill in all three fields'); return; }
  const id    = `rr-${num}-${last.toLowerCase().replace(/[\s\/]+/g,'-')}-${city.toLowerCase().replace(/[\s\/]+/g,'-')}`;
  const label = `RR-${num} · ${last} — ${city}`;
  if (PROVIDERS.find(p => p.id === id)) { showToast('Provider already exists'); return; }
  PROVIDERS.push({ id, label });
  PROVIDERS.sort((a, b) => a.id.localeCompare(b.id));
  await saveProviders();
  populateProviderSelect();
  closeModal();
  document.getElementById('provider-select').value = id;
  handleProviderChange(id);
  showToast(`${label} added`);
}

// ─────────────────────────────────────────────
// NOTES & QUESTIONS
// ─────────────────────────────────────────────
function getItemNotes(sId, idx)     { return getItemData(sId, idx)?.notes     || []; }
function getItemQuestions(sId, idx) { return getItemData(sId, idx)?.questions  || []; }
function tsNow() {
  return new Date().toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function showNotesModal(e, stageId, idx) {
  e.stopPropagation();
  if (!currentProvider) { showToast('Select a provider first'); return; }
  pendingAction = { type: 'notes', stageId, idx };
  document.getElementById('modal-title').style.display = 'none';
  document.getElementById('modal-actions').innerHTML = '';
  const text = STAGES.find(s => s.id === stageId).items[idx];
  document.getElementById('modal-body').innerHTML = buildNotesHTML(stageId, idx, text);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => {
    const ta = document.getElementById('note-textarea');
    ta?.focus();
    ta?.addEventListener('keydown', ev => { if (ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();submitNote(stageId,idx);} });
  }, 50);
}

function buildNotesHTML(stageId, idx, taskText) {
  const notes = getItemNotes(stageId, idx);
  const feedHTML = notes.length
    ? [...notes].reverse().map(n =>
        `<div class="whim-entry">
          <div class="whim-entry-avatar">${n.initials}</div>
          <div class="whim-entry-body">
            <div class="whim-entry-meta"><span class="whim-entry-name">${n.initials}</span><span>${n.ts}</span></div>
            <div class="whim-entry-text">${n.text.replace(/\n/g,'<br>')}</div>
          </div>
        </div>`).join('')
    : '<div class="whim-empty">No notes yet — add the first one.</div>';
  return `<div class="whim-modal">
  <div class="whim-header">
    <div class="whim-header-icon notes">📋</div>
    <div><div class="whim-header-title">Notes</div><div class="whim-header-sub">${taskText.substring(0,60)}${taskText.length>60?'…':''}</div></div>
    <button class="whim-close" onclick="closeWhimModal()">×</button>
  </div>
  <div class="whim-feed">${feedHTML}</div>
  <div class="whim-composer">
    <textarea id="note-textarea" placeholder="Add a note… (Cmd/Ctrl+Enter to save)"></textarea>
    <div class="whim-composer-actions">
      <button class="btn btn-ghost" onclick="closeWhimModal()">Cancel</button>
      <button class="btn btn-green" onclick="submitNote(${stageId},${idx})">Add note</button>
    </div>
  </div>
</div>`;
}

function submitNote(stageId, idx) {
  if (!currentInitials) { showToast('Enter your initials first'); return; }
  const text = document.getElementById('note-textarea')?.value.trim();
  if (!text) { showToast('Type a note first'); return; }
  const key = itemKey(stageId, idx);
  const ex = checkData[key] || { sigs:{}, assigned:[], notes:[], questions:[] };
  if (!ex.notes) ex.notes = [];
  ex.notes.push({ initials: currentInitials, ts: tsNow(), text });
  checkData[key] = ex;
  closeWhimModal();
  refreshStage(stageId);
  debouncedSave();
  showToast('Note added');
}

function showQuestionsModal(e, stageId, idx) {
  e.stopPropagation();
  if (!currentProvider) { showToast('Select a provider first'); return; }
  pendingAction = { type: 'questions', stageId, idx };
  document.getElementById('modal-title').style.display = 'none';
  document.getElementById('modal-actions').innerHTML = '';
  const text = STAGES.find(s => s.id === stageId).items[idx];
  document.getElementById('modal-body').innerHTML = buildQuestionsHTML(stageId, idx, text);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => {
    const ta = document.getElementById('q-textarea');
    ta?.focus();
    ta?.addEventListener('keydown', ev => { if (ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();submitQuestion(stageId,idx);} });
  }, 50);
}

function buildQuestionsHTML(stageId, idx, taskText) {
  const questions = getItemQuestions(stageId, idx);
  const open     = questions.filter(q => !q.answered);
  const answered = questions.filter(q =>  q.answered);

  const renderQ = (q, qIdx) => `
    <div class="whim-q-entry ${q.answered?'answered':''}">
      <div class="whim-q-check ${q.answered?'checked':''}" onclick="toggleQuestion(${stageId},${idx},${qIdx})">${q.answered?'✓':''}</div>
      <div class="whim-q-body">
        <div class="whim-q-text">${q.text}</div>
        <div class="whim-q-meta">${q.initials} · ${q.ts}</div>
        ${q.answered && q.answeredBy ? `<div class="whim-q-answered-label">✓ Answered by ${q.answeredBy} · ${q.answeredTs}</div>` : ''}
      </div>
    </div>`;

  const emptyHTML = !questions.length ? '<div class="whim-empty">No questions yet — ask one below.</div>' : '';
  const openHTML  = open.map(q     => renderQ(q, questions.indexOf(q))).join('');
  const divHTML   = open.length && answered.length ? '<div class="whim-section-label" style="margin-top:4px;">Answered</div>' : '';
  const answHTML  = answered.map(q => renderQ(q, questions.indexOf(q))).join('');

  return `<div class="whim-modal">
  <div class="whim-header">
    <div class="whim-header-icon questions">❓</div>
    <div><div class="whim-header-title">Questions</div><div class="whim-header-sub">${taskText.substring(0,60)}${taskText.length>60?'…':''}</div></div>
    <button class="whim-close" onclick="closeWhimModal()">×</button>
  </div>
  <div class="whim-feed">${emptyHTML}${openHTML}${divHTML}${answHTML}</div>
  <div class="whim-composer">
    <textarea id="q-textarea" placeholder="Ask a question… (Cmd/Ctrl+Enter to post)"></textarea>
    <div class="whim-composer-actions">
      <button class="btn btn-ghost" onclick="closeWhimModal()">Cancel</button>
      <button class="btn btn-green" onclick="submitQuestion(${stageId},${idx})">Ask</button>
    </div>
  </div>
</div>`;
}

function submitQuestion(stageId, idx) {
  if (!currentInitials) { showToast('Enter your initials first'); return; }
  const text = document.getElementById('q-textarea')?.value.trim();
  if (!text) { showToast('Type a question first'); return; }
  const key = itemKey(stageId, idx);
  const ex = checkData[key] || { sigs:{}, assigned:[], notes:[], questions:[] };
  if (!ex.questions) ex.questions = [];
  ex.questions.push({ initials: currentInitials, ts: tsNow(), text, answered: false });
  checkData[key] = ex;
  closeWhimModal();
  refreshStage(stageId);
  debouncedSave();
  showToast('Question posted');
}

function toggleQuestion(stageId, idx, qIdx) {
  if (!currentInitials) { showToast('Enter your initials first'); return; }
  const key = itemKey(stageId, idx);
  const ex  = checkData[key];
  if (!ex?.questions?.[qIdx]) return;
  const q = ex.questions[qIdx];
  q.answered = !q.answered;
  if (q.answered) { q.answeredBy = currentInitials; q.answeredTs = tsNow(); }
  else { delete q.answeredBy; delete q.answeredTs; }
  checkData[key] = ex;
  const taskText = STAGES.find(s => s.id === stageId).items[idx];
  document.getElementById('modal-body').innerHTML = buildQuestionsHTML(stageId, idx, taskText);
  refreshStage(stageId);
  debouncedSave();
}

function closeWhimModal() {
  document.getElementById('modal-title').style.display = '';
  closeModal();
}

// ─────────────────────────────────────────────
// FILTER
// ─────────────────────────────────────────────
let activeFilters = new Set(); // set of person names
let filterOpen = false;

function getAllAssignedPeople() {
  // Merge directory + any assigned-on-tasks people
  const seen = new Set();
  const people = [];
  // Start with directory
  for (const p of peopleDirectory) {
    if (!seen.has(p.name)) { seen.add(p.name); people.push(p); }
  }
  // Add anyone assigned to tasks but not in directory
  for (const val of Object.values(checkData)) {
    if (!val?.assigned) continue;
    for (const a of val.assigned) {
      if (!seen.has(a.name)) { seen.add(a.name); people.push(a); }
    }
  }
  return people.sort((a, b) => a.name.localeCompare(b.name));
}

function buildFilterDropdown() {
  const people = getAllAssignedPeople();
  const group = document.getElementById('filter-group');
  const dropdown = document.getElementById('filter-dropdown');
  if (!dropdown) return;

  // Show/hide filter group
  if (group) group.style.display = people.length > 0 ? 'flex' : 'none';

  if (people.length === 0) { activeFilters.clear(); return; }

  let html = `<button class="filter-clear-btn" onclick="clearFilter()">Show all</button>
<div class="filter-divider"></div>`;

  people.forEach(p => {
    const role = roleById(p.role);
    const checked = activeFilters.has(p.name) ? 'checked' : '';
    html += `
<label class="filter-option">
  <input type="checkbox" ${checked} onchange="toggleFilterPerson('${p.name.replace(/'/g,"\'")}', this.checked)" />
  <div class="filter-option-avatar ${role.cls}">${p.initials}</div>
  <div>
    <div class="filter-option-name">${p.name}</div>
    <div class="filter-option-role">${role.label}</div>
  </div>
</label>`;
  });

  dropdown.innerHTML = html;
  updateFilterTriggerLabel(people);
}

function updateFilterTriggerLabel(people) {
  const lbl = document.getElementById('filter-trigger-label');
  const trigger = document.getElementById('filter-trigger');
  if (!lbl) return;
  people = people || getAllAssignedPeople();
  if (activeFilters.size === 0) {
    lbl.textContent = 'All people';
    trigger?.classList.remove('active');
  } else if (activeFilters.size === 1) {
    lbl.textContent = [...activeFilters][0].split(' ')[0]; // first name only
    trigger?.classList.add('active');
  } else {
    lbl.textContent = `${activeFilters.size} people`;
    trigger?.classList.add('active');
  }
}

function toggleFilterDropdown() {
  filterOpen = !filterOpen;
  document.getElementById('filter-dropdown')?.classList.toggle('open', filterOpen);
}

function toggleFilterPerson(name, checked) {
  if (checked) activeFilters.add(name);
  else activeFilters.delete(name);
  updateFilterTriggerLabel();
  applyFilter();
}

function clearFilter() {
  activeFilters.clear();
  buildFilterDropdown();
  applyFilter();
  // close dropdown
  filterOpen = false;
  document.getElementById('filter-dropdown')?.classList.remove('open');
}

function applyFilter() {
  if (activeFilters.size === 0) {
    // Remove all dimming
    document.querySelectorAll('.item-row.dimmed').forEach(r => r.classList.remove('dimmed'));
    document.querySelectorAll('.stage-block.all-dimmed').forEach(b => b.classList.remove('all-dimmed'));
    return;
  }

  STAGES.forEach(stage => {
    let anyVisible = false;
    stage.items.forEach((_, idx) => {
      const assigned = getAssigned(stage.id, idx);
      const matches = assigned.some(a => activeFilters.has(a.name));
      const row = document.getElementById(`item-${stage.id}-${idx}`);
      if (row) {
        row.classList.toggle('dimmed', !matches);
        if (matches) anyVisible = true;
      }
    });
    const block = document.getElementById(`stage-${stage.id}`);
    if (block) block.classList.toggle('all-dimmed', !anyVisible);
  });
}

// Close filter dropdown when clicking outside
document.addEventListener('click', function(e) {
  if (filterOpen && !document.getElementById('filter-dropdown-wrap')?.contains(e.target)) {
    filterOpen = false;
    document.getElementById('filter-dropdown')?.classList.remove('open');
  }
});

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  const savedInitials = localStorage.getItem('rr_initials');
  if (savedInitials) {
    currentInitials = savedInitials;
    document.getElementById('initials-input').value = savedInitials;
    document.getElementById('initials-avatar').textContent = savedInitials;
  }
  await loadProviders();
  populateProviderSelect();
}

init();
</script>
